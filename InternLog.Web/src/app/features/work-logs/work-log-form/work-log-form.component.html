<div class="page-container">
  <div class="page-header">
    <div class="breadcrumb">
      <a routerLink="/work-logs">← กลับไปหน้ารายการ</a>
    </div>
    <h2>{{ isEditMode ? 'แก้ไขบันทึกงาน' : 'เพิ่มบันทึกงานใหม่' }}</h2>
  </div>

  <div class="row-layout">
    <!-- Left: Main Form (8 cols) -->
    <div class="col-8">
      <div class="card">
        <form [formGroup]="logForm" class="log-form">
          <div class="form-row">
            <div class="form-group flex-1">
              <label>วันที่ปฏิบัติงาน</label>
              <input type="date" formControlName="logDate" class="form-control" [class.is-invalid]="logForm.get('logDate')?.invalid && logForm.get('logDate')?.touched">
            </div>
            <div class="form-group flex-2">
              <label>หัวข้อ/ชื่องาน</label>
              <input type="text" formControlName="title" class="form-control" placeholder="เช่น ศึกษาเทคโนโลยีใหม่..." [class.is-invalid]="logForm.get('title')?.invalid && logForm.get('title')?.touched">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group flex-1">
              <label>ประเภทงาน</label>
              <select formControlName="category" class="form-control" [class.is-invalid]="logForm.get('category')?.invalid && logForm.get('category')?.touched">
                <option value="">เลือกประเภท</option>
                <option value="Development">Development (เขียนโค้ด)</option>
                <option value="Design">Design (ออกแบบ)</option>
                <option value="Meeting">Meeting (ประชุม)</option>
                <option value="Research">Research (ค้นคว้า)</option>
                <option value="Document">Document (เอกสาร)</option>
              </select>
            </div>
            <div class="form-group flex-1">
              <label>ชั่วโมงปฏิบัติงาน (ชม.)</label>
              <input type="number" formControlName="hours" class="form-control" min="1" max="24" [class.is-invalid]="logForm.get('hours')?.invalid && logForm.get('hours')?.touched">
            </div>
          </div>

          <div class="form-group">
            <label>รายละเอียดงานที่ปฏิบัติ (ผลลัพธ์ที่ได้)</label>
            <textarea formControlName="description" class="form-control" rows="5" [class.is-invalid]="logForm.get('description')?.invalid && logForm.get('description')?.touched"></textarea>
          </div>

          <div class="form-group">
            <label>ปัญหาอุปสรรค (ถ้ามี)</label>
            <textarea formControlName="problem" class="form-control" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label>แนวทางแก้ไขปัญหา (ถ้ามี)</label>
            <textarea formControlName="solution" class="form-control" rows="3"></textarea>
          </div>
        </form>
      </div>
    </div>

    <!-- Right: Attachments & Status (4 cols) -->
    <div class="col-4 side-panel">
      <div class="card status-card">
        <h3>สถานะ</h3>
        <span class="badge badge-secondary">{{ isEditMode ? 'ฉบับร่าง (Draft)' : 'สร้างใหม่ (New)' }}</span>
        <p class="text-sm mt-3">ระบบบันทึกแบบร่างอัตโนมัติทุก 30 วินาที</p>
      </div>

      <div class="card attachment-card">
        <h3>ไฟล์แนบ / ผลงาน</h3>
        <div class="file-upload-zone">
          <div class="upload-icon">📎</div>
          <p>ลากไฟล์มาวาง หรือ <strong>เลือกไฟล์</strong></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Actions (Sticky) -->
  <div class="form-footer card">
    <button class="btn-secondary" (click)="saveDraft()" [disabled]="isLoading">
      <span *ngIf="!isLoading">💾 บันทึกแบบร่าง</span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>
    <button class="btn-primary" (click)="submitLog()" [disabled]="isLoading || logForm.invalid">
      <span *ngIf="!isLoading">✅ ส่งอนุมัติ</span>
      <span *ngIf="isLoading" class="spinner"></span>
    </button>
  </div>
</div>
