<div class="page-container">
  <div class="page-header space-between">
    <div>
      <h2>บันทึกการปฏิบัติงาน</h2>
      <p>ประวัติการทำงานรายวันของคุณ</p>
    </div>
    <button class="btn-primary" routerLink="/work-logs/new">
      <span>+ เพิ่มบันทึกงาน</span>
    </button>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="filter-group">
        <select class="form-control" [(ngModel)]="filters.month" aria-label="กรองตามเดือน" title="กรองตามเดือน">
          <option value="08-2026">สิงหาคม 2569</option>
          <option value="07-2026">กรกฎาคม 2569</option>
        </select>

        <select class="form-control" [(ngModel)]="filters.status" aria-label="กรองตามสถานะ" title="กรองตามสถานะ">
          <option value="">ทุกสถานะ</option>
          <option value="draft">ฉบับร่าง</option>
          <option value="pending">รออนุมัติ</option>
          <option value="approved">อนุมัติแล้ว</option>
          <option value="returned">ตีกลับ</option>
        </select>

        <select class="form-control" [(ngModel)]="filters.category" aria-label="กรองตามประเภท" title="กรองตามประเภท">
          <option value="">ทุกประเภท</option>
          <option value="Development">Development</option>
          <option value="Design">Design</option>
          <option value="Meeting">Meeting</option>
        </select>
      </div>

      <div class="search-box">
        <input type="text" class="form-control" placeholder="ค้นหาชื่องาน..." [(ngModel)]="filters.search">
      </div>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>วันที่</th>
            <th>ชื่องาน</th>
            <th>ประเภท</th>
            <th>ชม.</th>
            <th>สถานะ</th>
            <th>การจัดการ</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let log of filteredLogs">
            <td>{{ log.logDate | date:'dd/MM/yyyy' }}</td>
            <td class="log-title">{{ log.title }}</td>
            <td>
              <span class="chip">{{ log.category }}</span>
            </td>
            <td>{{ log.hoursSpent }}</td>
            <td>
              <span class="badge" [ngClass]="getStatusBadgeClass(log.status)">
                {{ getStatusText(log.status) }}
              </span>
            </td>
            <td>
              <div class="actions">
                <button class="btn-icon" title="ดู/แก้ไข" [routerLink]="['/work-logs', log.logID]">👁</button>
                <button class="btn-icon text-danger" title="ลบ" *ngIf="log.status === 'draft'"
                  (click)="deleteLog(log.logID)">🗑</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span>แสดง 1-5 จาก 5 รายการ</span>
      <div class="page-controls">
        <button class="btn-page" disabled>&lt;</button>
        <button class="btn-page active">1</button>
        <button class="btn-page" disabled>&gt;</button>
      </div>
    </div>
  </div>
</div>
