<div class="page-container">
  <div class="page-header space-between">
    <div>
      <h2>จัดการสถานประกอบการ</h2>
      <p>รายชื่อบริษัทที่รับนักศึกษาเข้าฝึกงาน</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary">+ เพิ่มบริษัท</button>
    </div>
  </div>

  <div class="card table-card">
    <table class="table">
      <thead>
        <tr>
          <th>ชื่อบริษัท</th>
          <th>ที่อยู่</th>
          <th>เบอร์โทรศัพท์</th>
          <th>เวลาทำการ</th>
          <th>นศ. ที่ฝึกอยู่</th>
          <th>จัดการ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let company of companies">
          <td class="font-bold text-primary">{{ company.name }}</td>
          <td class="text-secondary">{{ company.address }}</td>
          <td>{{ company.phone }}</td>
          <td>{{ company.time }}</td>
          <td>{{ company.studentCount }} คน</td>
          <td>
            <div class="actions">
              <button class="btn-icon">✏️</button>
              <button class="btn-icon text-danger">🗑️</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
