<aside class="sidebar-container">
  <div class="logo-area">
    <h2 class="logo-text">InternLog</h2>
  </div>
  
  <nav class="nav-menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span class="icon">🏠</span> แดชบอร์ด
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/attendance" routerLinkActive="active" class="nav-item">
      <span class="icon">⏰</span> ลงเวลา
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/leaves" routerLinkActive="active" class="nav-item">
      <span class="icon">🏖</span> วันลา
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/calendar" routerLinkActive="active" class="nav-item">
      <span class="icon">📅</span> ปฏิทิน
    </a>
    <a *ngIf="isStudent() || isAdvisor()" routerLink="/work-logs" routerLinkActive="active" class="nav-item">
      <span class="icon">📝</span> บันทึกงาน
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/tasks" routerLinkActive="active" class="nav-item">
      <span class="icon">📋</span> งานมอบหมาย
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/visits" routerLinkActive="active" class="nav-item">
      <span class="icon">🧑</span> การนิเทศ
    </a>
    <a *ngIf="isStudent() || isAdvisor() || isAdmin()" routerLink="/reports" routerLinkActive="active" class="nav-item">
      <span class="icon">📊</span> รายงาน
    </a>
    <a *ngIf="isStudent() || isAdvisor()" routerLink="/evaluations" routerLinkActive="active" class="nav-item">
      <span class="icon">⭐</span> ประเมินผล
    </a>

    <ng-container *ngIf="isAdvisor() || isAdmin()">
      <div class="nav-divider"></div>
      <div class="nav-section-title">{{ isAdmin() ? 'จัดการระบบ' : 'การจัดการ' }}</div>
      
      <a *ngIf="isAdmin()" routerLink="/admin/users" routerLinkActive="active" class="nav-item">
        <span class="icon">👥</span> จัดการผู้ใช้
      </a>
      <a *ngIf="isAdvisor()" routerLink="/companies" routerLinkActive="active" class="nav-item">
        <span class="icon">🏢</span> จัดการบริษัท
      </a>
      <a *ngIf="isAdmin()" routerLink="/admin/companies" routerLinkActive="active" class="nav-item">
        <span class="icon">🏢</span> จัดการบริษัท
      </a>
      <a *ngIf="isAdmin()" routerLink="/admin/internships" routerLinkActive="active" class="nav-item">
        <span class="icon">🔗</span> จัดการจับคู่
      </a>
    </ng-container>
  </nav>

  <div class="nav-bottom">
    <a routerLink="/profile" routerLinkActive="active" class="nav-item">
      <span class="icon">⚙️</span> โปรไฟล์
    </a>
    <a (click)="logout()" class="nav-item logout-btn" style="cursor: pointer;">
      <span class="icon">🚪</span> ออกจากระบบ
    </a>
  </div>
</aside>
